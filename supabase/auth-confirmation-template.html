<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4efe7;font-family:Arial,Helvetica,sans-serif;color:#2f4039;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4efe7;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#fffaf3;border:1px solid #d8c4a3;border-radius:18px;overflow:hidden;">
            <tr>
              <td align="center" style="padding:34px 28px 20px;">
                <img src="https://curated-by-carly.vercel.app/images/curated-email-logo.png" width="360" alt="Curated — The Private Wardrobe" style="display:block;width:100%;max-width:360px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:10px 36px 38px;">
                <p style="margin:0 0 10px;font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.25;color:#173d31;">Welcome to Curated</p>
                <p style="margin:0 auto 26px;max-width:460px;font-size:15px;line-height:1.7;color:#68736d;">Confirm your email address to open your private wardrobe and finish creating your account.</p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#173d31;color:#fffaf3;text-decoration:none;padding:14px 26px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;">Confirm my email</a>
                <p style="margin:26px auto 0;max-width:460px;font-size:12px;line-height:1.6;color:#8a7770;">You received this message because an account was requested for this email address. If that wasn’t you, you can safely ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
